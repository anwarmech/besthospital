```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU Roster Generator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#173f7a;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.controls{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:12px;
  align-items:center;
}

label{
  font-weight:700;
}

input,select,button{
  padding:9px 12px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}

button{
  background:#173f7a;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.staff-row{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:10px;
  align-items:center;
  margin-bottom:8px;
}

#generatedImage{
  display:block;
  width:100%;
  max-width:1024px;
  margin:20px auto;
  border-radius:4px;
}

.history{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-top:20px;
}

.history-item{
  padding:10px;
  border-bottom:1px solid #ddd;
}

.history-item:last-child{
  border-bottom:none;
}

@media(max-width:600px){
  .staff-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>ICU Roster Generator</h1>

<div class="controls">

  <div class="row">
    <label for="date">Date:</label>
    <input type="date" id="date">
  </div>

  <div class="row">
    <label for="patients">Patient Count:</label>
    <input type="number" id="patients" min="0" value="0">
  </div>

  <h3>Staff Shift</h3>

  <div id="staffContainer"></div>

  <div class="row">
    <button onclick="generateRoster()">Generate Roster</button>
    <button onclick="downloadImage()">Download Image</button>
    <button onclick="shareImage()">Share Image</button>
  </div>

</div>

<img id="generatedImage" alt="Generated ICU Roster">

<div class="history">
  <h2>Roster History</h2>
  <div id="historyList"></div>
</div>

</div>

<script>

const STAFF = [
  "Mahapriya",
  "Priyanka",
  "Joythi",
  "Dongoo",
  "Vibishaya",
  "Akbar Basha"
];

const SHIFT_OPTIONS = [
  {
    value:"M",
    label:"Morning (8 AM - 4 PM)"
  },
  {
    value:"E",
    label:"Evening (12 PM - 8 PM)"
  },
  {
    value:"N",
    label:"Night (8 PM - 8 AM)"
  },
  {
    value:"OFF",
    label:"OFF / Leave"
  }
];

let currentImage = null;


/* =========================
   INITIALIZE STAFF DROPDOWNS
   ========================= */

function initializeStaff(){

  const container =
    document.getElementById("staffContainer");

  container.innerHTML = "";

  STAFF.forEach((name,index)=>{

    const row =
      document.createElement("div");

    row.className="staff-row";

    const label =
      document.createElement("label");

    label.textContent=name;

    const select =
      document.createElement("select");

    select.id="staff_"+index;

    SHIFT_OPTIONS.forEach(option=>{

      const opt =
        document.createElement("option");

      opt.value=option.value;
      opt.textContent=option.label;

      select.appendChild(opt);

    });

    /*
      Default assignment.
      You can change these if required.
    */

    if(index === 0){
      select.value="M";
    }
    else if(index === 1){
      select.value="E";
    }
    else if(index === 2){
      select.value="N";
    }
    else{
      select.value="OFF";
    }

    row.appendChild(label);
    row.appendChild(select);

    container.appendChild(row);

  });

}


/* =========================
   DATE FORMAT
   ========================= */

function formatDate(dateString){

  const date =
    new Date(dateString + "T00:00:00");

  const day =
    String(date.getDate()).padStart(2,"0");

  const month =
    String(date.getMonth()+1).padStart(2,"0");

  const year =
    date.getFullYear();

  return `${day}/${month}/${year}`;

}


/* =========================
   DRAW NORMAL TEXT
   ========================= */

function drawText(
  ctx,
  text,
  x,
  y,
  size,
  weight="400",
  color="#173f7a"
){

  ctx.font =
    `${weight} ${size}px Arial`;

  ctx.fillStyle=color;
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    x,
    y
  );

}


/* =========================
   DRAW STAFF NAMES
   ONLY MAHAPRIYA IS BOLD
   ========================= */

function drawNames(
  ctx,
  text,
  x,
  y
){

  const names =
    text.split(",").map(
      name=>name.trim()
    ).filter(Boolean);

  if(names.length===0){
    return;
  }

  ctx.textBaseline="middle";
  ctx.fillStyle="#173f7a";

  let currentX=x;

  names.forEach((name,index)=>{

    /*
      Only Mahapriya is bold.
      The * is immediately after Mahapriya.
    */

    if(name === "Mahapriya"){

      ctx.font="700 28px Arial";

      ctx.fillText(
        "Mahapriya",
        currentX,
        y
      );

      currentX +=
        ctx.measureText("Mahapriya").width;

      ctx.font="400 28px Arial";

      ctx.fillText(
        "*",
        currentX,
        y
      );

      currentX +=
        ctx.measureText("*").width;

    }
    else{

      ctx.font="400 28px Arial";

      ctx.fillText(
        name,
        currentX,
        y
      );

      currentX +=
        ctx.measureText(name).width;

    }

    /*
      Add comma and space between names.
    */

    if(index < names.length-1){

      ctx.font="400 28px Arial";

      ctx.fillText(
        ", ",
        currentX,
        y
      );

      currentX +=
        ctx.measureText(", ").width;

    }

  });

}


/* =========================
   CREATE IMAGE
   ========================= */

async function createImage(
  date,
  patients,
  assignments
){

  const img =
    new Image();

  /*
    Load the ORIGINAL image.jpg.
    Nothing is recreated or modified.
  */

  await new Promise(
    (resolve,reject)=>{

      img.onload=resolve;

      img.onerror=()=>{
        reject(
          new Error(
            "Could not load image.jpg. Make sure image.jpg is in the same folder as this HTML file."
          )
        );
      };

      img.src="./image.jpg";

    }
  );


  const canvas =
    document.createElement("canvas");

  canvas.width=1024;
  canvas.height=1536;

  const ctx =
    canvas.getContext("2d");


  /*
    IMPORTANT:
    Draw the original image exactly as supplied.

    No green card.
    No Staff Incharge.
    No extra graphics.
    No background recreation.
    No color modification.
  */

  ctx.drawImage(
    img,
    0,
    0,
    1024,
    1536
  );


  const shifts={
    M:[],
    E:[],
    N:[],
    OFF:[]
  };


  STAFF.forEach(name=>{

    const shift =
      assignments[name];

    if(shifts[shift]){
      shifts[shift].push(name);
    }

  });


  /*
    ONLY dynamic text is added below.
  */

  const formattedDate =
    formatDate(date);


  /* Date */

  drawText(
    ctx,
    formattedDate,
    168,
    490,
    34,
    "700",
    "#173f7a"
  );


  /* Patient count */

  drawText(
    ctx,
    String(patients),
    694,
    490,
    36,
    "700",
    "#173f7a"
  );


  /* Morning */

  drawNames(
    ctx,
    shifts.M.join(", ") || "None",
    298,
    700
  );


  /* Evening */

  drawNames(
    ctx,
    shifts.E.join(", ") || "None",
    298,
    908
  );


  /* Night */

  drawNames(
    ctx,
    shifts.N.join(", ") || "None",
    298,
    1117
  );


  /* OFF / Leave */

  drawNames(
    ctx,
    shifts.OFF.join(", ") || "None",
    298,
    1318
  );


  return canvas.toDataURL(
    "image/png"
  );

}


/* =========================
   GENERATE ROSTER
   ========================= */

async function generateRoster(){

  try{

    const date =
      document.getElementById("date").value;

    const patients =
      document.getElementById("patients").value;

    if(!date){

      alert("Please select a date.");
      return;

    }


    const assignments={};

    STAFF.forEach(
      (name,index)=>{

        assignments[name] =
          document.getElementById(
            "staff_"+index
          ).value;

      }
    );


    currentImage =
      await createImage(
        date,
        patients,
        assignments
      );


    document.getElementById(
      "generatedImage"
    ).src=currentImage;


    saveRoster(
      date,
      patients,
      assignments
    );


    loadHistory();

  }
  catch(error){

    console.error(error);

    alert(error.message);

  }

}


/* =========================
   DOWNLOAD IMAGE
   ========================= */

function downloadImage(){

  if(!currentImage){

    alert(
      "Please generate the roster first."
    );

    return;

  }


  const date =
    document.getElementById("date").value ||
    "roster";


  const link =
    document.createElement("a");

  link.download =
    `ICU_Roster_${date}.png`;

  link.href=currentImage;

  link.click();

}


/* =========================
   SHARE IMAGE
   ========================= */

async function shareImage(){

  if(!currentImage){

    alert(
      "Please generate the roster first."
    );

    return;

  }


  try{

    const response =
      await fetch(currentImage);

    const blob =
      await response.blob();


    const date =
      document.getElementById("date").value ||
      "roster";


    const file =
      new File(
        [blob],
        `ICU_Roster_${date}.png`,
        {
          type:"image/png"
        }
      );


    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){

      await navigator.share({
        title:"ICU Roster",
        files:[file]
      });

    }
    else{

      alert(
        "Image sharing is not supported in this browser. Please use Download Image."
      );

    }

  }
  catch(error){

    console.error(error);

  }

}


/* =========================
   SAVE ROSTER
   ========================= */

function saveRoster(
  date,
  patients,
  assignments
){

  const history =
    JSON.parse(
      localStorage.getItem(
        "icuRosterHistory"
      ) || "[]"
    );


  const existingIndex =
    history.findIndex(
      item=>item.date===date
    );


  const record={
    date,
    patients,
    assignments
  };


  if(existingIndex>=0){

    history[existingIndex]=record;

  }
  else{

    history.push(record);

  }


  localStorage.setItem(
    "icuRosterHistory",
    JSON.stringify(history)
  );

}


/* =========================
   LOAD HISTORY
   ========================= */

function loadHistory(){

  const history =
    JSON.parse(
      localStorage.getItem(
        "icuRosterHistory"
      ) || "[]"
    );


  const container =
    document.getElementById(
      "historyList"
    );


  container.innerHTML="";


  if(history.length===0){

    container.innerHTML =
      "<p>No roster history.</p>";

    return;

  }


  history
    .slice()
    .reverse()
    .forEach(record=>{

      const div =
        document.createElement("div");

      div.className=
        "history-item";


      const formatted =
        formatDate(record.date);


      const assignments =
        record.assignments;


      const summary =
        STAFF.map(
          name=>
            `${name}: ${
              getShiftLabel(
                assignments[name]
              )
            }`
        ).join(" | ");


      div.innerHTML=
        `<strong>${formatted}</strong>
         — Patients: ${record.patients}
         <br>
         ${summary}`;


      container.appendChild(div);

    });

}


/* =========================
   SHIFT LABEL
   ========================= */

function getShiftLabel(value){

  const option =
    SHIFT_OPTIONS.find(
      item=>item.value===value
    );

  return option
    ? option.label
    : value;

}


/* =========================
   INITIAL PAGE SETUP
   ========================= */

function setToday(){

  const today =
    new Date();


  const year =
    today.getFullYear();

  const month =
    String(
      today.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      today.getDate()
    ).padStart(2,"0");


  document.getElementById(
    "date"
  ).value =
    `${year}-${month}-${day}`;

}


/* =========================
   START
   ========================= */

initializeStaff();
setToday();
loadHistory();

</script>

</body>
</html>
