<body>
<div class="container">

<script>

const STAFF = [
  "Mahapriya",
  "Priyanka",
  "Joythi",
  "Dongoo",
  "Vibishaya",
  "Akbar Basha"
];

const TARGETS = {
  M:8,
  E:8,
  N:8,
  OFF:6
};

const HISTORY_KEY = "best_hospital_icu_history";
const ROSTER_KEY = "best_hospital_icu_rosters";

/*
  IMPORTANT:
  image.jpg must be in the SAME folder as this HTML file.
*/
const TEMPLATE = "./image.jpg";

let history =
  JSON.parse(localStorage.getItem(HISTORY_KEY) || "null")
  || emptyHistory();

let rosters =
  JSON.parse(localStorage.getItem(ROSTER_KEY) || "null")
  || {};

function emptyHistory(){

  const h={};

  STAFF.forEach(n=>{
    h[n]={
      M:0,
      E:0,
      N:0,
      OFF:0
    };
  });

  return h;
}

function tomorrowISO(){

  const d=new Date();

  d.setDate(d.getDate()+1);

  const y=d.getFullYear();

  const m=String(d.getMonth()+1).padStart(2,"0");

  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

document.getElementById("rosterDate").value=tomorrowISO();


function renderStaff(){

  const box=document.getElementById("staffList");

  box.innerHTML="";

  STAFF.forEach((name,i)=>{

    const row=document.createElement("div");

    row.className="staff-row";

    row.innerHTML=`
      <div class="staff-name">
        ${escapeHtml(name)}
      </div>

      <select class="staff-select" id="s${i}">

        <option value="M">
          Morning (8 AM - 4 PM)
        </option>

        <option value="E">
          Evening (12 PM - 8 PM)
        </option>

        <option value="N">
          Night (8 PM - 8 AM)
        </option>

        <option value="OFF">
          OFF / Leave
        </option>

      </select>
    `;

    box.appendChild(row);

  });
}


function renderHistory(){

  const body=document.getElementById("historyBody");

  body.innerHTML="";

  STAFF.forEach(name=>{

    const d=history[name] || {
      M:0,
      E:0,
      N:0,
      OFF:0
    };

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>
        <b>${escapeHtml(name)}</b>
      </td>

      <td>
        <span class="done">${d.M}</span>
      </td>

      <td>
        <span class="done">${d.E}</span>
      </td>

      <td>
        <span class="done">${d.N}</span>
      </td>

      <td>
        <span class="done">${d.OFF}</span>
      </td>
    `;

    body.appendChild(tr);

  });
}


function assignment(){

  const a={};

  STAFF.forEach((name,i)=>{
    a[name]=document.getElementById("s"+i).value;
  });

  return a;
}


function save(){

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

  localStorage.setItem(
    ROSTER_KEY,
    JSON.stringify(rosters)
  );
}


function loadDate(){

  const date=
    document.getElementById("rosterDate").value;

  const old=rosters[date];

  if(!old){

    setStatus(
      "New roster date",
      "#0284c7"
    );

    return;
  }

  STAFF.forEach((name,i)=>{

    document.getElementById("s"+i).value=
      old.assignment[name] || "M";

  });

  document.getElementById("patientCount").value=
    old.patientCount;

  setStatus(
    "Existing roster loaded.",
    "#16a34a"
  );
}


document
  .getElementById("rosterDate")
  .addEventListener("change",loadDate);


/*
  Generate roster
*/
async function generateRoster(){

  const date=
    document.getElementById("rosterDate").value;

  const patients=
    document.getElementById("patientCount").value;

  if(!date){

    alert("Please select a date.");

    return;
  }

  if(
    patients==="" ||
    Number(patients)<0
  ){

    alert("Enter a valid patient count.");

    return;
  }

  const a=assignment();


  /*
    Remove previous history for this date
    before replacing it.
  */
  if(rosters[date]){

    const old=
      rosters[date].assignment || {};

    STAFF.forEach(name=>{

      const sh=old[name];

      if(
        history[name] &&
        history[name][sh]>0
      ){

        history[name][sh]--;
      }

    });
  }


  STAFF.forEach(name=>{

    if(!history[name]){

      history[name]={
        M:0,
        E:0,
        N:0,
        OFF:0
      };

    }

    history[name][a[name]]++;

  });


  rosters[date]={
    patientCount:Number(patients),
    assignment:a
  };

  save();

  renderHistory();


  try{

    const data=
      await createImage(
        date,
        Number(patients),
        a
      );

    document.getElementById(
      "generatedImage"
    ).src=data;

    document.getElementById(
      "generatedBox"
    ).style.display="block";

    setStatus(
      "Roster image generated successfully.",
      "#16a34a"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Could not load image.jpg. Check that image.jpg is in the same folder.",
      "#dc2626"
    );

    alert(
      "Could not load image.jpg.\n\n" +
      "Make sure the file is named exactly:\n" +
      "image.jpg\n\n" +
      "and is in the same GitHub folder as this HTML file."
    );

  }
}


/*
  CREATE IMAGE

  The source image is now:
      ./image.jpg

  It is loaded using onload rather than img.decode()
  for better compatibility with GitHub Pages.
*/
async function createImage(date,patients,a){

  const img=new Image();

  await new Promise((resolve,reject)=>{

    img.onload=resolve;

    img.onerror=()=>{

      reject(
        new Error(
          "Could not load image.jpg"
        )
      );

    };

    img.src=TEMPLATE;

  });


  const c=document.createElement("canvas");

  c.width=1024;
  c.height=1536;

  const ctx=c.getContext("2d");

  ctx.drawImage(
    img,
    0,
    0,
    1024,
    1536
  );


  drawOffLeaveCard(ctx);


  const shifts={
    M:[],
    E:[],
    N:[],
    OFF:[]
  };


  STAFF.forEach(n=>{
    shifts[a[n]].push(n);
  });


  const formatted=
    formatDate(date);


  drawText(
    ctx,
    formatted,
    168,
    490,
    34,
    "700",
    "#173f7a"
  );


  drawText(
    ctx,
    String(patients),
    694,
    490,
    36,
    "700",
    "#173f7a"
  );


  drawNames(
    ctx,
    shifts.M.join(", ") || "None",
    298,
    700
  );


  drawNames(
    ctx,
    shifts.E.join(", ") || "None",
    298,
    908
  );


  drawNames(
    ctx,
    shifts.N.join(", ") || "None",
    298,
    1117
  );


  drawNames(
    ctx,
    shifts.OFF.join(", ") || "None",
    298,
    1318
  );


  drawText(
    ctx,
    "* Staff Incharge",
    39,
    1371,
    18,
    "700",
    "#173f7a"
  );


  return c.toDataURL("image/png");
}


function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r,
  fill,
  stroke=null,
  lineWidth=1
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    r
  );

  ctx.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    r
  );

  ctx.arcTo(
    x,
    y+h,
    x,
    y,
    r
  );

  ctx.arcTo(
    x,
    y,
    x+w,
    y,
    r
  );

  ctx.closePath();


  if(fill){

    ctx.fillStyle=fill;

    ctx.fill();

  }


  if(stroke){

    ctx.strokeStyle=stroke;

    ctx.lineWidth=lineWidth;

    ctx.stroke();

  }
}


function drawOffLeaveCard(ctx){

  const x=39;
  const y=1184;
  const w=945;
  const h=164;
  const r=25;
  const headerH=76;

  const body='#dff4e8';
  const header='#b6e6c9';
  const border='#62bf8d';
  const logo='#68cd97';
  const badge='#4fba7e';


  roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r,
    body,
    border,
    3
  );


  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    x+r,
    y
  );

  ctx.lineTo(
    x+w-r,
    y
  );

  ctx.quadraticCurveTo(
    x+w,
    y,
    x+w,
    y+r
  );

  ctx.lineTo(
    x+w,
    y+headerH
  );

  ctx.lineTo(
    x,
    y+headerH
  );

  ctx.lineTo(
    x,
    y+r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+r,
    y
  );

  ctx.closePath();

  ctx.fillStyle=header;

  ctx.fill();

  ctx.lineWidth=6;
  ctx.lineCap='round';


  ctx.beginPath();

  ctx.moveTo(80,1260);
  ctx.lineTo(80,1221);

  ctx.moveTo(80,1258);
  ctx.lineTo(138,1258);

  ctx.moveTo(84,1242);
  ctx.lineTo(138,1242);

  ctx.stroke();


  roundRect(

  );

  ctx.moveTo(134,1242);
  ctx.lineTo(134,1260);

  ctx.stroke();


  ctx.font='700 16px Arial';

  ctx.fillText(
    'Z',
    124,
    1220
  );


  ctx.font='700 11px Arial';

  ctx.fillText(
    'Z',
    139,
    1210
  );


  drawText(

    '#173f7a'
  );


  roundRect(

  );

  ctx.fillStyle='#fff';

  ctx.textAlign='center';

  ctx.fillText(

  );

  /*

  */

  ctx.fillStyle='#1868b9';

  );

  );

  );

  );

function drawText(
  ctx,
  text,
  x,
  y,
  size,
  weight,
  color
){

  ctx.font=
    `${weight} ${size}px Arial, Helvetica, sans-serif`;

  ctx.fillStyle=color;

  ctx.textBaseline="alphabetic";

  ctx.fillText(
    text,
    x,
    y
  );
}


function drawNames(
  ctx,
  text,
  x,
  y
){

  const names=
    text
      .split(/,\s*/)
      .filter(Boolean);


  let size=31;

  const maxWidth=650;


  /*
    Only Mahapriya is bold.
    All other staff names are normal.
  */

  const displayNames=
    names.map(
      n=>n==="Mahapriya"
        ? "Mahapriya*"
        : n
    );


  function measureAt(fontSize){

    let w=0;


    displayNames.forEach((n,i)=>{

      const special=
        n==="Mahapriya*";


      ctx.font=
        `${special?700:400} ${fontSize}px Arial, Helvetica, sans-serif`;


      w+=ctx.measureText(n).width;


      if(i<displayNames.length-1){

        ctx.font=
          `400 ${fontSize}px Arial, Helvetica, sans-serif`;

        w+=ctx.measureText(", ").width;

      }

    });


    return w;
  }


  while(
    measureAt(size)>maxWidth &&
    size>20
  ){

    size--;

  }


  let cursor=x;


  ctx.textBaseline="alphabetic";


  displayNames.forEach((name,i)=>{

    const special=
      name==="Mahapriya*";


    ctx.font=
      `${special?700:400} ${size}px Arial, Helvetica, sans-serif`;

    ctx.fillStyle="#173f7a";


    if(special){

      const main="Mahapriya";


      ctx.fillText(
        main,
        cursor,
        y
      );


      cursor+=
        ctx.measureText(main).width;


      const starSize=
        Math.max(
          18,
          Math.round(size*0.68)
        );


      ctx.font=
        `700 ${starSize}px Arial, Helvetica, sans-serif`;


      ctx.fillText(
        "*",
        cursor,
        y-2
      );


      cursor+=
        ctx.measureText("*").width;


    }else{

      ctx.fillText(
        name,
        cursor,
        y
      );


      cursor+=
        ctx.measureText(name).width;

    }


    if(i<displayNames.length-1){

      ctx.font=
        `400 ${size}px Arial, Helvetica, sans-serif`;


      ctx.fillText(
        ", ",
        cursor,
        y
      );


      cursor+=
        ctx.measureText(", ").width;

    }

  });
}


function formatDate(iso){

  const d=
    new Date(
      iso+"T00:00:00"
    );


  const months=[
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];


  return `${
    String(d.getDate()).padStart(2,"0")
  } ${
    months[d.getMonth()]
  } ${
    d.getFullYear()
  }`;
}


async function downloadImage(){

  const date=
    document.getElementById(
      "rosterDate"
    ).value;


  if(!date){

    alert(
      "Generate a roster first."
    );

    return;
  }


  const a=assignment();


  const patients=
    Number(
      document.getElementById(
        "patientCount"
      ).value
    );


  try{

    const data=
      await createImage(
        date,
        patients,
        a
      );


    const link=
      document.createElement("a");


    link.download=
      `BestHospital_ICU_Roster_${date}.png`;


    link.href=data;


    link.click();


    setStatus(
      "Image downloaded.",
      "#16a34a"
    );


  }catch(error){

    console.error(error);

    alert(
      "Could not load image.jpg. " +
      "Make sure it is in the same folder as this HTML file."
    );

  }
}


async function shareImage(){

  const date=
    document.getElementById(
      "rosterDate"
    ).value;


  if(!date){

    alert(
      "Generate a roster first."
    );

    return;
  }


  const a=assignment();


  const patients=
    Number(
      document.getElementById(
        "patientCount"
      ).value
    );


  try{

    const data=
      await createImage(
        date,
        patients,
        a
      );


    const blob=
      await (
        await fetch(data)
      ).blob();


    const file=
      new File(
        [blob],
        `BestHospital_ICU_Roster_${date}.png`,
        {
          type:"image/png"
        }
      );


    if(
      navigator.share &&
      (
        !navigator.canShare ||
        navigator.canShare({
          files:[file]
        })
      )
    ){

      try{

        await navigator.share({

          title:
            "ICU Daily Duty Roster",

          text:
            `ICU Daily Duty Roster - ${formatDate(date)}`,

          files:[file]

        });


        setStatus(
          "Share menu opened.",
          "#16a34a"
        );

        return;

      }catch(e){}

    }


    /*
      Fallback
    */

    const link=
      document.createElement("a");


    link.download=file.name;

    link.href=data;

    link.click();


    alert(
      "Direct image sharing is not supported " +
      "by this browser. The image has been downloaded; " +
      "attach it in WhatsApp."
    );


  }catch(error){

    console.error(error);

    alert(
      "Could not load image.jpg. " +
      "Make sure it is in the same folder as this HTML file."
    );

  }
}


function resetHistory(){

  if(
    !confirm(
      "Reset ALL staff history and saved rosters?"
    )
  ){

    return;
  }


  history=emptyHistory();

  rosters={};


  localStorage.removeItem(
    HISTORY_KEY
  );


  localStorage.removeItem(
    ROSTER_KEY
  );


  renderHistory();


  setStatus(
    "History reset.",
    "#dc2626"
  );
}


function setStatus(
  text,
  color
){

  const s=
    document.getElementById(
      "status"
    );


  s.textContent=text;

  s.style.color=color;
}


function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m])
  );
}


/*
  Initialize
*/

renderStaff();

renderHistory();
